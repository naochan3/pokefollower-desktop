# native/pokefollower_core.wasm is validated against its recorded rustc producer by
# scripts/verify-wasm-artifact.cjs. Update the compiler and regenerate the artifact together.
# The CI diff check ensures the committed WASM matches the pinned toolchain.
[toolchain]
channel = "1.98.1"
profile = "minimal"
components = ["rustfmt"]
targets = ["wasm32-unknown-unknown"]
