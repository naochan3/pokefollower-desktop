name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - run: npm ci
      - run: cargo fmt --manifest-path crates/follower_core/Cargo.toml --check
      - run: npm test
      - run: npm run test:rust
      - run: npm run dist:win -- --dir
